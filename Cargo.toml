# =============================================================================
#  R E P S   ·   web-net
# =============================================================================
[package]
name    = "web-net"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Web layer on serve-net: URL normalization, sites and base paths, a compiled router with 404 and 405, gate checkpoints for authentication and authorization, hooks, error pages, and a render trait that reads typed views."

# Keywords (5 max)
keywords = ["web", "framework", "router", "http", "server"]

# Categories
categories = ["web-programming", "web-programming::http-server"]

# Links
homepage      = "https://github.com/jamesgober/web-net"
repository    = "https://github.com/jamesgober/web-net"
documentation = "https://docs.rs/web-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "web_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party crates at published versions only (dev/DIRECTIVES.md section 2).
# serve-net: the server web-net runs in; HttpService, HttpRequest, HttpReply.
serve-net = { version = "0.7.1", default-features = false, features = ["http1"] }
# cookie-net: reading the Cookie field for gates (duplicates refused).
cookie-net = { version = "0.7.1", default-features = false, features = ["std"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
