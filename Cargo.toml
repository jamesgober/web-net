# =============================================================================
#  R E P S   ·   web-net
# =============================================================================
[package]
name    = "web-net"
version = "0.7.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# The fuzz crate is not part of the package.
exclude = ["fuzz/"]

# Description
description = "Web layer on serve-net: URL normalization, sites and base paths, a compiled router with 404 and 405, gate checkpoints for authentication and authorization, hooks, error pages, and a render trait that reads typed views."

# Keywords (5 max)
keywords = ["web", "framework", "router", "http", "server"]

# Categories
categories = ["web-programming", "web-programming::http-server"]

# Links
homepage      = "https://github.com/jamesgober/web-net"
repository    = "https://github.com/jamesgober/web-net"
documentation = "https://docs.rs/web-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "web_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []
# Uploads: Cx::upload and form-net's Store (private temporary files).
uploads = ["form-net/fs"]


# DEPENDENCIES
# #################################
[dependencies]
# First-party crates at published versions only (dev/DIRECTIVES.md section 2).
# serve-net: the server web-net runs in; HttpService, HttpRequest, HttpReply.
serve-net = { version = "0.7.1", default-features = false, features = ["http1"] }
# cookie-net: reading the Cookie field for gates (duplicates refused).
cookie-net = { version = "0.7.1", default-features = false, features = ["std"] }
# parse-net: entity tags, HTTP dates, ranges, and content negotiation.
parse-net = { version = "0.9.2", default-features = false, features = ["std"] }
# form-net: urlencoded and multipart forms, typed extraction, uploads.
form-net = { version = "0.9", default-features = false, features = ["std"] }
# csrf-sec: session-bound tokens and the origin policy.
csrf-sec = { version = "0.9.3", default-features = false, features = ["std"] }
# compress-lib: gzip for replies when nothing in front compresses.
compress-lib = { version = "0.9", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# The example site renders with Luminess (first party, zero dependencies).
luminess = "0.7"

[[example]]
name = "site"
required-features = ["uploads"]

[[bench]]
name = "web"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
